name: Validar

on:
  workflow_dispatch:
    inputs:
      id:
        default: '54'
      componente:
        default: 'NGA6002707_Coastal.Ecuador:H1'

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ida.txt
      - run: pip install -r requirements-ida.txt
      - name: Descifrar registros
        env:
          REG_PASS: ${{ secrets.REG_PASS }}
        run: gpg --batch --quiet --pinentry-mode loopback --passphrase "$REG_PASS" -d registros_cifrados/nga_ok.tgz.gpg | tar xz
      - run: nproc && python -u codigo/validar_nube.py ${{ inputs.id }} '${{ inputs.componente }}'
